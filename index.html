<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игры — Шахматы и Шашки</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif;
    background: #0b1021;
    color: #e8eaf2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    touch-action: manipulation;
  }

  h1 { font-size: 2rem; margin: 0 0 30px; letter-spacing: 0.05em; }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 460px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px 20px;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 16px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: transform 0.1s, border-color 0.2s;
  }

  .card:active { transform: scale(0.98); }
  .card:hover { border-color: #6ee7b7; transform: translateY(-2px); }

  .card.checkers:hover { border-color: #fca5a5; }

  .icon { font-size: 44px; width: 64px; text-align: center; line-height: 1; }

  .info { flex: 1; }

  .info .name {
    font-size: 1.3rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info .desc { font-size: 0.92rem; color: #94a3b8; margin-top: 4px; }

  .arrow { font-size: 1.6rem; color: #64748b; }

  .note {
    margin-top: 26px;
    font-size: 0.85rem;
    color: #64748b;
    text-align: center;
    line-height: 1.6;
  }

  @media (max-width: 480px) {
    .menu { max-width: 100%; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<h1>🎲 Настольные игры</h1>

<div class="menu">
  <a href="chess.html" class="card">
    <div class="icon">♔♚</div>
    <div class="info">
      <div class="name">Шахматы</div>
      <div class="desc">С другом или против бота</div>
    </div>
    <div class="arrow">▸</div>
  </a>

  <a href="checkers.html" class="card checkers">
    <div class="icon">⚪⚫</div>
    <div class="info">
      <div class="name">Шашки</div>
      <div class="desc">Русские шашки, дамки, обязательное взятие</div>
    </div>
    <div class="arrow">▸</div>
  </a>

  <a href="tictactoe.html" class="card">
    <div class="icon">❌⭕</div>
    <div class="info">
      <div class="name">Крестики-нолики</div>
      <div class="desc">Три в ряд, с ботом или другом</div>
    </div>
    <div class="arrow">▸</div>
  </a>
</div>

<p class="note">Откройте любую игру в браузере — на телефоне или ПК. Игры работают офлайн.</p>
</body>
</html>
